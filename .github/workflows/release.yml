name: Release

# Push a tag vX.Y.Z that matches appVersion in app/build.gradle.kts to publish a
# GitHub Release with the signed APK. A pull request that changes this file
# builds and signs the APK the same way but publishes nothing, so signing is
# checked before a tag.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  release:
    name: Signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # appVersion in app/build.gradle.kts is the version the app shows, so the
      # tag has to agree with it rather than override it.
      - name: Check tag against appVersion
        id: version
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [[ -z "$version" ]]; then
            echo "::error::Cannot find appVersion in app/build.gradle.kts"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match appVersion $version: bump appVersion, or tag v$version"
              exit 1
            fi
            name=$version
          else
            name=$version-pr$PR_NUMBER
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "appVersion $version, artifact name $name"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # gradle.properties points org.gradle.java.home at Android Studio's JDK on
      # macOS. The user-level gradle.properties takes precedence over it.
      - name: Use the runner's JDK
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-36" > /dev/null

      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest

      # Checks the secrets against the keystore before the build, with errors
      # that say which one is wrong: Gradle's own error masks the alias.
      - name: Decode and check keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! listing=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD"); then
            echo "::error::Cannot open the keystore: check KEYSTORE_BASE64 and KEYSTORE_PASSWORD"
            exit 1
          fi
          aliases=$(sed -n 's/^Alias name: //p' <<< "$listing")
          if ! grep -qixF -- "$KEY_ALIAS" <<< "$aliases"; then
            echo "::error::KEY_ALIAS (${#KEY_ALIAS} characters) is not a key in the keystore, which has: $(paste -sd, - <<< "$aliases")"
            exit 1
          fi

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify signature and checksum
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --print-certs "$apk"
          mkdir dist
          out=umm-${{ steps.version.outputs.name }}.apk
          cp "$apk" "dist/$out"
          (cd dist && sha256sum "$out" > SHA256SUMS && cat SHA256SUMS)

      - name: Upload APK (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-check-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
